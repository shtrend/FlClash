name: build-ios

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "${HOME}/.cargo/bin" >> $GITHUB_PATH

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Add iOS platform
        run: flutter create --platforms=ios --org com.flclash --project-name fl_clash .

      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Run setup (build native assets)
        run: dart setup.dart macos -v

      - name: Build unsigned iOS app
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 || true
          set -e

      - name: Verify and package IPA
        run: |
          WORKDIR="$(pwd)"
          APP="$(find "$WORKDIR/build/ios" -name "Runner.app" -type d | head -1)"
          echo "APP: $APP"
          if [ -z "$APP" ]; then
            echo "Runner.app not found"
            find "$WORKDIR/build/ios" -maxdepth 3 -type d
            exit 1
          fi
          du -sh "$APP"
          STAGE="$WORKDIR/ipa_staging"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          ( cd "$STAGE" && zip -qry "$WORKDIR/FlClash-unsigned.ipa" Payload/ )
          echo "=== IPA ==="
          ls -lh "$WORKDIR/FlClash-unsigned.ipa"
          cp "$WORKDIR/FlClash-unsigned.ipa" "$WORKDIR/build/FlClash-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-unsigned
          path: build/FlClash-unsigned.ipa
          retention-days: 30

      - name: Upload build dir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-build-dir
          path: build/ios/
          if-no-files-found: ignore
          retention-days: 3
