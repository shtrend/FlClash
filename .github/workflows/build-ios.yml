name: build-ios-v12

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Add iOS platform
        run: flutter create --platforms=ios --org com.flclash --project-name fl_clash .

      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build iOS app (ignore Flutter signing exit code)
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 || true
          set -e
          echo "=== build/ios structure ==="
          find build/ios -maxdepth 4 -type d 2>/dev/null
          echo "=== Looking for Runner.app ==="
          find build/ios -name "Runner.app" -type d 2>/dev/null

      - name: Manually fix Runner.app (add Flutter framework + find Runner binary)
        run: |
          WORKDIR="$(pwd)"
          
          # Find Runner.app from flutter build output
          APP="$(find "$WORKDIR/build/ios" -name "Runner.app" -type d | head -1)"
          
          # If not found, search DerivedData
          if [ -z "$APP" ]; then
            APP="$(find "$WORKDIR" -name "Runner.app" -type d 2>/dev/null | head -1)"
          fi
          
          echo "APP: $APP"
          if [ -z "$APP" ]; then
            echo "Runner.app not found anywhere!"
            find "$WORKDIR" -name "*.app" -type d 2>/dev/null | head -10
            exit 1
          fi
          
          echo "=== Runner.app contents before fix ==="
          ls -la "$APP/"
          
          # Find Flutter.framework
          FRAMEWORK="$(find "$WORKDIR/build/ios" -name "Flutter.framework" -type d 2>/dev/null | head -1)"
          if [ -z "$FRAMEWORK" ]; then
            FRAMEWORK="$(find "$WORKDIR" -name "Flutter.framework" -type d 2>/dev/null | head -1)"
          fi
          echo "Flutter.framework: $FRAMEWORK"
          
          # Find Runner binary
          RUNNER_BIN="$(find "$WORKDIR" -name "Runner" -type f -not -path "*.app/*" 2>/dev/null | head -1)"
          if [ -z "$RUNNER_BIN" ]; then
            # Maybe it's inside the app already but hidden
            RUNNER_BIN="$(find "$APP" -name "Runner" -type f 2>/dev/null | head -1)"
          fi
          echo "Runner binary: $RUNNER_BIN"
          
          # Create Frameworks directory and copy Flutter framework
          mkdir -p "$APP/Frameworks"
          if [ -n "$FRAMEWORK" ] && [ -d "$FRAMEWORK" ]; then
            cp -R "$FRAMEWORK" "$APP/Frameworks/"
            echo "Copied Flutter.framework to Frameworks/"
          fi
          
          # Copy Runner binary if found outside app
          if [ -n "$RUNNER_BIN" ] && [ -f "$RUNNER_BIN" ]; then
            cp "$RUNNER_BIN" "$APP/Runner"
            chmod +x "$APP/Runner"
            echo "Copied Runner binary"
          fi
          
          echo "=== Runner.app contents after fix ==="
          ls -la "$APP/"
          ls -la "$APP/Frameworks/" 2>/dev/null || echo "No Frameworks"
          
          # Check if Runner executable exists
          if [ -f "$APP/Runner" ]; then
            echo "SUCCESS: Runner executable found!"
            file "$APP/Runner"
          else
            echo "WARNING: Runner executable still missing"
          fi

      - name: Package IPA
        run: |
          WORKDIR="$(pwd)"
          APP="$(find "$WORKDIR/build/ios" -name "Runner.app" -type d | head -1)"
          if [ -z "$APP" ]; then
            APP="$(find "$WORKDIR" -name "Runner.app" -type d 2>/dev/null | head -1)"
          fi
          echo "Packaging: $APP"
          
          STAGE="$WORKDIR/ipa_staging"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          ( cd "$STAGE" && zip -qry "$WORKDIR/FlClash-unsigned.ipa" Payload/ )
          
          echo "=== IPA ==="
          ls -lh "$WORKDIR/FlClash-unsigned.ipa"
          unzip -l "$WORKDIR/FlClash-unsigned.ipa" | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-unsigned
          path: FlClash-unsigned.ipa
          retention-days: 30
