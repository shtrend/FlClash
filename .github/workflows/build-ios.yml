name: build-ios-v13

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Add iOS platform
        run: flutter create --platforms=ios --org com.flclash --project-name fl_clash .

      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build iOS app (ignore Flutter signing exit code)
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 || true
          set -e

      - name: Find ANY Mach-O binary (Runner or otherwise)
        run: |
          WORKDIR="$(pwd)"
          echo "=== All files in build/ios ==="
          find "$WORKDIR/build/ios" -type f 2>/dev/null | head -50
          echo "=== All Mach-O binaries ==="
          find "$WORKDIR/build/ios" -type f -exec file {} \; 2>/dev/null | grep -i "mach-o\|executable" | head -20
          echo "=== Search entire workspace for Runner binary ==="
          find "$WORKDIR" -name "Runner" -type f 2>/dev/null | head -10
          find "$WORKDIR" -name "*.app" -type d 2>/dev/null | head -10

      - name: Package IPA with whatever we have
        run: |
          WORKDIR="$(pwd)"
          APP="$(find "$WORKDIR/build/ios" -name "Runner.app" -type d | head -1)"
          if [ -z "$APP" ]; then
            APP="$(find "$WORKDIR" -name "Runner.app" -type d 2>/dev/null | head -1)"
          fi
          echo "APP: $APP"
          
          STAGE="$WORKDIR/ipa_staging"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            cp -R "$APP" "$STAGE/Payload/"
          fi
          
          # Also copy Flutter.framework if found at root level
          FW="$(find "$WORKDIR/build/ios" -name "Flutter.framework" -type d | head -1)"
          if [ -n "$FW" ] && [ -d "$FW" ]; then
            mkdir -p "$STAGE/Payload/Runner.app/Frameworks"
            cp -R "$FW" "$STAGE/Payload/Runner.app/Frameworks/"
          fi
          
          ( cd "$STAGE" && zip -qry "$WORKDIR/FlClash-unsigned.ipa" Payload/ )
          echo "=== IPA ==="
          ls -lh "$WORKDIR/FlClash-unsigned.ipa"
          unzip -l "$WORKDIR/FlClash-unsigned.ipa" | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-unsigned
          path: FlClash-unsigned.ipa
          retention-days: 30
