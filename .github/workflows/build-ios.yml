name: build-ios

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Add iOS platform
        run: flutter create --platforms=ios --org com.flclash --project-name fl_clash .

      - name: Disable native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter pub get

      - name: Build unsigned iOS app (ignore signing exit code)
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 || true
          set -e
          echo "=== build/ios dirs ==="
          find build/ios -maxdepth 3 -type d 2>/dev/null

      - name: Package as IPA from Runner.app
        run: |
          WORKDIR="$(pwd)"
          APP="$(find "$WORKDIR/build/ios" -name "Runner.app" -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "Runner.app not found!"
            find "$WORKDIR/build/ios" -type f 2>/dev/null | head -50
            exit 1
          fi
          echo "Found: $APP"
          STAGE="$WORKDIR/ipa_staging"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          ( cd "$STAGE" && zip -qry "$WORKDIR/FlClash-unsigned.ipa" Payload/ )
          echo "=== Verify IPA ==="
          ls -lh "$WORKDIR/FlClash-unsigned.ipa"
          cp "$WORKDIR/FlClash-unsigned.ipa" "$WORKDIR/build/FlClash-unsigned.ipa"
          ls -lh "$WORKDIR/build/FlClash-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-unsigned
          path: build/FlClash-unsigned.ipa
          retention-days: 30

      - name: Upload build dir for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-build-dir
          path: build/ios/
          if-no-files-found: ignore
          retention-days: 3
