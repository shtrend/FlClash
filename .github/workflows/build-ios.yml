name: build-ios-v11

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Add iOS platform
        run: flutter create --platforms=ios --org com.flclash --project-name fl_clash .

      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build Runner.app with xcodebuild (no signing)
        run: |
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tail -30

      - name: Find Runner.app and package IPA
        run: |
          WORKDIR="$(pwd)"
          APP="$(find "$WORKDIR/DerivedData" -name "Runner.app" -type d | head -1)"
          echo "APP: $APP"
          if [ -z "$APP" ]; then
            echo "Runner.app not found in DerivedData"
            find "$WORKDIR/DerivedData" -maxdepth 6 -type d 2>/dev/null | head -30
            exit 1
          fi
          du -sh "$APP"
          echo "=== Runner.app contents ==="
          ls -la "$APP/"
          echo "=== Runner binary ==="
          ls -la "$APP/Runner" 2>/dev/null || echo "Runner binary NOT found"
          echo "=== Frameworks ==="
          ls -la "$APP/Frameworks/" 2>/dev/null || echo "No Frameworks dir"

          STAGE="$WORKDIR/ipa_staging"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          ( cd "$STAGE" && zip -qry "$WORKDIR/FlClash-unsigned.ipa" Payload/ )
          echo "=== IPA ==="
          ls -lh "$WORKDIR/FlClash-unsigned.ipa"
          unzip -l "$WORKDIR/FlClash-unsigned.ipa" | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-unsigned
          path: FlClash-unsigned.ipa
          retention-days: 30

      - name: Upload DerivedData for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flclash-deriveddata
          path: DerivedData/Build/Products/
          if-no-files-found: ignore
          retention-days: 3
