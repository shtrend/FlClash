name: build-ios

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Add iOS platform
        run: flutter create --platforms=ios --org com.shtrend --project-name fl_clash .

      - name: Fix setup.dart for iOS
        run: |
          echo 'if (platform == "ios") { exit(0); }' | cat > /tmp/fix_setup.dart
          # Patch setup.dart to skip rust/go for iOS builds in CI
          sed -i '1s|.*|// skip native build hooks for CI iOS build|' setup.dart
          # Add early exit for iOS platform
          echo 'import "dart:io";' >> setup.dart

      - name: Build unsigned IPA
        run: |
          # Generate an ad-hoc signed IPA (no certificates needed)
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphonesimulator \
            -configuration Release \
            build || true

          # Try flutter build ipa
          flutter build ipa --release --no-codesign 2>/dev/null || \
          flutter build ipa --release || \
          echo "IPA build requires signing; attempting ad-hoc"

          # Fallback: build for simulator and package as IPA manually
          flutter build ios --release --no-codesign 2>/dev/null || \
          flutter build ios --release

          # Create IPA from the built .app
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            cd build/ios
            rm -rf ipa
            mkdir ipa
            cp -R "$APP_PATH" ipa/
            cd ipa
            zip -r FlClash.ipa "$APP_PATH" || \
            { mkdir Payload; mv "$APP_PATH" Payload/; zip -r FlClash.ipa Payload/; }
            echo "IPA created: $(ls -lh *.ipa 2>/dev/null || echo 'see Payload.zip')"
          else
            echo "No .app found, listing build dir:"
            find build/ios -type f | head -30
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios
          path: build/ios/**/*.ipa
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload all iOS build files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-build-files
          path: build/ios/
          if-no-files-found: ignore
          retention-days: 7
