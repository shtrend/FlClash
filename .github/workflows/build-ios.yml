name: build-ios

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Add iOS platform
        run: flutter create --platforms=ios --org com.flclash --project-name fl_clash .

      - name: Disable native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package as IPA
        run: |
          cd build/ios/iphoneos
          rm -rf ../ipa_staging
          mkdir -p ../ipa_staging/Payload
          cp -R Runner.app ../ipa_staging/Payload/
          cd ../ipa_staging
          zip -qry ../FlClash-unsigned.ipa Payload/
          ls -lh ../FlClash-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-unsigned
          path: build/ipa_staging/FlClash-unsigned.ipa
          retention-days: 30

      - name: Upload all build files (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-build-dir
          path: build/ios/
          if-no-files-found: ignore
          retention-days: 3
