name: build-ios-v14

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Add iOS platform
        run: flutter create --platforms=ios --org com.flclash --project-name fl_clash .

      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Disable code signing in Xcode project
        run: |
          WORKDIR="$(pwd)"
          PBX="$WORKDIR/ios/Runner.xcodeproj/project.pbxproj"
          
          # Replace CODE_SIGNING_ALLOWED = YES with NO
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$PBX"
          
          # Replace CODE_SIGN_IDENTITY values with empty
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' "$PBX"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Distribution";/CODE_SIGN_IDENTITY = "";/g' "$PBX"
          
          # Add CODE_SIGNING_REQUIRED = NO to all build configurations
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$PBX"
          
          echo "=== Verification ==="
          grep -n "CODE_SIGNING_ALLOWED\|CODE_SIGN_IDENTITY\|CODE_SIGNING_REQUIRED" "$PBX" | head -20

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build with xcodebuild (no signing)
        run: |
          xcodebuild build \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tail -40

      - name: Find Runner.app and package IPA
        run: |
          WORKDIR="$(pwd)"
          echo "=== Searching DerivedData ==="
          find "$WORKDIR/DerivedData" -name "Runner.app" -type d 2>/dev/null
          
          APP="$(find "$WORKDIR/DerivedData" -name "Runner.app" -type d | head -1)"
          
          if [ -z "$APP" ]; then
            echo "Runner.app not found in DerivedData, searching build/ios"
            APP="$(find "$WORKDIR/build/ios" -name "Runner.app" -type d | head -1)"
          fi
          
          echo "APP: $APP"
          if [ -z "$APP" ]; then
            echo "Runner.app not found anywhere!"
            find "$WORKDIR" -name "*.app" -type d 2>/dev/null | head -10
            exit 1
          fi
          
          echo "=== Runner.app contents ==="
          ls -la "$APP/"
          echo "=== Runner binary ==="
          ls -la "$APP/Runner" 2>/dev/null || echo "Runner binary NOT found"
          echo "=== Frameworks ==="
          ls -la "$APP/Frameworks/" 2>/dev/null || echo "No Frameworks dir"

          STAGE="$WORKDIR/ipa_staging"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          ( cd "$STAGE" && zip -qry "$WORKDIR/FlClash-unsigned.ipa" Payload/ )
          
          echo "=== IPA ==="
          ls -lh "$WORKDIR/FlClash-unsigned.ipa"
          unzip -l "$WORKDIR/FlClash-unsigned.ipa" | head -30

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: flclash-ios-unsigned
          path: FlClash-unsigned.ipa
          retention-days: 30
